<!doctype html>
<html lang="en">
<head>
   <meta charset="utf-8">
   <title>Acme Corporation Feedback</title>
</head>
<body>
<h1>Contact Us</h1>
<form action="https://student2.cs.appstate.edu/crr/3440/homework/h3/contact/" 
      method="post">
      <fieldset>
         <legend>Send Us Feedback</legend>
         <label for="emailTo">To: <br>
            <input type="text" name="emailTo" id="emailTo"> 
         </label>
         <br>
         <br>
         <label for="emailFrom">Your email address: <br>
            <input type="email" name="emailFrom" id="emailFrom" required>
         </label>
         <br>
         <br>
         <label for="emailBody">Message:<br>
          <textarea name="emailBody" id="emailBody" cols="20" rows="5"
               placeholder="Type your comments here..." required></textarea>
         </label>
      </fieldset>
      <fieldset>
         <legend>Survey Questions</legend>
         <label for="referrer">How do you hear about us?
            <br>
            <select name="referrer" id="referrer">
               <option value="google">Google</option>
               <option value="ad">Newspaper ad</option>
               <option value="friend">Friend</option>
               <option value="other (case sensitive)">Other</option>
            </select>
         </label>
         <br>
         <br>
         <label for="newsletter">Would you like to receive our newsletter? 
            <br>
            <input type="checkbox" id= "newsletter" name="newsletter" value="yes" checked> 
            Yes please. Send me the newsletter.
         </label>
      </fieldset>
      <fieldset>
         <legend>Rate our Service</legend>
         <input id="rating_1" type="radio" name="rating" value="1">
         <label for="rating_1">Very Poor</label>
         <br>
         <input id="rating_2" type="radio" name="rating" value="2">
         <label for="rating_2">Poor</label>
         <br>
         <input id="rating_3" type="radio" name="rating" value="3">
         <label for="rating_3">Average</label>
         <br>
         <input id="rating_4" type="radio" name="rating" value="4">
         <label for="rating_4">Good</label>
         <br>
         <input id="rating_5" type="radio" name="rating" value="5">
         <label for="rating_5">Very Good</label>​
      </fieldset>
      <input type="submit" value="Send Message">
</form>  
</body>
</html>
